services:
  - type: web
    name: geevheit-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: ohio # ou oregon / frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8085
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false # Será preenchido com a string do Supabase Nuvem SP
      - key: OWNER_USER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://geevheit.vercel.app,https://web-lake-eight-gwn3vopv94.vercel.app
      - key: BASE_URL
        sync: false
      - key: DB_SIMPLE_PROTOCOL
        value: "true"
      - key: AGENT_RUNNER_TYPE
        value: "gemini"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
