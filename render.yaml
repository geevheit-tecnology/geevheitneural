services:
  - type: web
    name: geevheit-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: ohio # ou oregon / frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8085
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false # Será preenchido com a string do Supabase Nuvem SP
      - key: OWNER_USER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BASE_URL
        sync: false
